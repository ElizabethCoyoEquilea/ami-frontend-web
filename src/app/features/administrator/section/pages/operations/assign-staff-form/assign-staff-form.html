<div class="staff-backdrop" role="presentation">
  <form class="staff-form" [formGroup]="staffForm" (ngSubmit)="submitStaff()">
    <div class="staff-heading">
      <h3>Asignar personal</h3>
    </div>

    <p class="assignment-summary">Servicio programado para {{ assignmentDate }}.</p>

    <div>
      <label for="staff-name">Personal disponible</label>
      <select
        id="staff-name"
        formControlName="staffId"
        [disabled]="isLoadingStaff || !!staffErrorMessage || availableStaff.length === 0"
      >
        <option value="">
          @if (isLoadingStaff) {
            Cargando personal...
          } @else {
            Selecciona personal
          }
        </option>

        @for (staff of availableStaff; track staff.id) {
          <option [value]="staff.id">{{ staff.name }} - {{ staff.specialty }}</option>
        }
      </select>

      @if (staffErrorMessage) {
        <p class="field-error">{{ staffErrorMessage }}</p>
      } @else if (!isLoadingStaff && availableStaff.length === 0) {
        <p class="field-error">No hay proveedores disponibles para este taller.</p>
      }

      @if (staffIsInvalid()) {
        <p class="field-error">Selecciona una persona disponible.</p>
      }
    </div>

    <div class="staff-actions">
      <button type="submit" [disabled]="isLoadingStaff || !!staffErrorMessage || availableStaff.length === 0">
        Asignar personal
      </button>
      <button type="button" (click)="cancel()">Cancelar</button>
    </div>
  </form>
</div>
