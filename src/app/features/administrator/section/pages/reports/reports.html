<app-navbar></app-navbar>

<main class="section-layout">
  <app-sidebar></app-sidebar>
  <section class="section-content">
    <div class="reports-shell">
      <section class="reports-header">
        <div>
          <p class="eyebrow">Reportes</p>
          <h1>Analisis operativo y financiero del taller</h1>
        </div>
      </section>

      <form class="filter-panel" [formGroup]="operationalFilterForm" (ngSubmit)="goToOperationalReport()">
        <div class="filter-copy">
          <div>
            <p class="eyebrow">Reporte</p>
            <h2>Servicios realizados</h2>
          </div>
          <span>Operativo</span>
        </div>

        <div class="date-field">
          <label for="service-start-date">Fecha inicio</label>
          <input id="service-start-date" type="date" formControlName="startDate" />
        </div>

        <div class="date-field">
          <label for="service-end-date">Fecha fin</label>
          <input id="service-end-date" type="date" formControlName="endDate" />
        </div>

        <div class="filter-actions">
          <button type="submit">Generar reporte</button>
        </div>
      </form>

      <form class="filter-panel" [formGroup]="financialFilterForm" (ngSubmit)="goToFinancialReport()">
        <div class="filter-copy">
          <div>
            <p class="eyebrow">Reporte</p>
            <h2>Ingresos</h2>
          </div>
          <span>Financiero</span>
        </div>

        <div class="date-field">
          <label for="income-start-date">Fecha inicio</label>
          <input id="income-start-date" type="date" formControlName="startDate" />
        </div>

        <div class="date-field">
          <label for="income-end-date">Fecha fin</label>
          <input id="income-end-date" type="date" formControlName="endDate" />
        </div>

        <div class="filter-actions">
          <button type="submit">Generar reporte</button>
        </div>
      </form>
    </div>   
  </section>
</main>
