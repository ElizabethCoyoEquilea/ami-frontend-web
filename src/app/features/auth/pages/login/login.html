<main class="flex min-h-screen items-center justify-center bg-[var(--color-fondo)] px-4 py-10">
  <section class="w-full max-w-md rounded-lg bg-[var(--color-formulario)] p-8 shadow-sm">
    <div class="mb-8">
      <p class="text-sm font-bold uppercase text-[var(--color-titulo)]">AMI</p>
      <h1 class="mt-2 text-3xl font-extrabold text-[var(--color-titulo)]">Iniciar sesion</h1>
      <p class="mt-2 text-sm text-[var(--color-texto-secundario)]">Ingresa con tus credenciales para continuar.</p>
    </div>

    <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <div>
        <label class="mb-2 block text-sm font-bold uppercase text-[var(--color-texto-secundario)]" for="email">
          Correo electronico
        </label>
        <input
          class="w-full rounded-md border border-[var(--color-borde)] bg-[var(--color-input)] px-3 py-2 text-[var(--color-texto)] outline-none transition placeholder:text-[var(--color-placeholder)] focus:border-[var(--color-titulo)] focus:bg-[var(--color-blanco)] focus:ring-2 focus:ring-[var(--color-titulo)]/10"
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="usuario@correo.com"
        />

        @if (emailIsInvalid) {
          <p class="mt-2 text-sm text-[var(--color-error)]">Ingresa un correo electronico valido.</p>
        }
      </div>

      <div>
        <label class="mb-2 block text-sm font-bold uppercase text-[var(--color-texto-secundario)]" for="password">
          Contrasena
        </label>
        <input
          class="w-full rounded-md border border-[var(--color-borde)] bg-[var(--color-input)] px-3 py-2 text-[var(--color-texto)] outline-none transition placeholder:text-[var(--color-placeholder)] focus:border-[var(--color-titulo)] focus:bg-[var(--color-blanco)] focus:ring-2 focus:ring-[var(--color-titulo)]/10"
          id="contrasena"
          type="password"
          formControlName="contrasena"
          autocomplete="current-password"
          placeholder="Minimo 6 caracteres"
        />

        @if (passwordIsInvalid) {
          <p class="mt-2 text-sm text-[var(--color-error)]">La contrasena debe tener al menos 6 caracteres.</p>
        }
      </div>

      @if (errorMessage) {
        <p class="rounded-md border border-[var(--color-error-borde)] bg-[var(--color-error-fondo)] px-3 py-2 text-sm text-[var(--color-error)]">
          {{ errorMessage }}
        </p>
      }

      <button
        class="w-full rounded-md bg-[var(--color-boton)] px-4 py-2.5 font-bold text-[var(--color-blanco)] transition hover:bg-[var(--color-boton-hover)] disabled:cursor-not-allowed disabled:bg-[var(--color-deshabilitado)]"
        type="submit"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <p class="text-center text-sm text-[var(--color-texto-secundario)]">
        No tienes cuenta?
        <a class="font-bold text-[var(--color-titulo)] hover:text-[var(--color-boton-hover)]" routerLink="/register">
          Registrate ahora
        </a>
      </p>
    </form>
  </section>
</main>
