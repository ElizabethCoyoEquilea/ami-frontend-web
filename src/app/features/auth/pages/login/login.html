<main class="flex min-h-screen items-center justify-center bg-gray-100 px-4 py-10">
  <section class="w-full max-w-md rounded-lg bg-white p-8 shadow-sm">
    <div class="mb-8">
      <p class="text-sm font-bold uppercase text-blue-950">AMI</p>
      <h1 class="mt-2 text-3xl font-extrabold text-blue-950">Iniciar sesion</h1>
      <p class="mt-2 text-sm text-gray-600">Ingresa con tus credenciales para continuar.</p>
    </div>

    <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <div>
        <label class="mb-2 block text-sm font-bold uppercase text-gray-500" for="email">Correo electronico</label>
        <input
          class="w-full rounded-md border border-gray-200 bg-gray-100 px-3 py-2 text-black outline-none transition placeholder:text-gray-400 focus:border-blue-950 focus:bg-white focus:ring-2 focus:ring-blue-950/10"
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="usuario@correo.com"
        />

        @if (emailIsInvalid) {
          <p class="mt-2 text-sm text-red-600">Ingresa un correo electronico valido.</p>
        }
      </div>

      <div>
        <label class="mb-2 block text-sm font-bold uppercase text-gray-500" for="password">Contrasena</label>
        <input
          class="w-full rounded-md border border-gray-200 bg-gray-100 px-3 py-2 text-black outline-none transition placeholder:text-gray-400 focus:border-blue-950 focus:bg-white focus:ring-2 focus:ring-blue-950/10"
          id="contrasena"
          type="password"
          formControlName="contrasena"
          autocomplete="current-password"
          placeholder="Minimo 6 caracteres"
        />

        @if (passwordIsInvalid) {
          <p class="mt-2 text-sm text-red-600">La contrasena debe tener al menos 6 caracteres.</p>
        }
      </div>

      @if (errorMessage) {
        <p class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
          {{ errorMessage }}
        </p>
      }

      <button
        class="w-full rounded-md bg-blue-950 px-4 py-2.5 font-bold text-white transition hover:bg-black disabled:cursor-not-allowed disabled:bg-gray-400"
        type="submit"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <p class="text-center text-sm text-gray-600">
        No tienes cuenta?
        <a class="font-bold text-blue-950 hover:text-black" routerLink="/register">Registrate ahora</a>
      </p>
    </form>
  </section>
</main>
