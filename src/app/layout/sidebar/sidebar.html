<aside class="sidebar">
  <div>
    <nav class="nav-list" aria-label="Menu del taller">
      @for (item of items; track item.section) {
        <a
          class="nav-link"
          [routerLink]="getRoute(item.section)"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </div>

  <div class="sidebar-actions">
    <a
      class="profile-link"
      [routerLink]="getRoute('profile')"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Mi Perfil
    </a>
    <a class="switch-workshop" routerLink="/admin/my-workshops">Cambiar de Taller</a>
  </div>
</aside>
